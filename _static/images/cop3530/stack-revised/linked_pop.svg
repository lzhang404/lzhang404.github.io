<text x="814" y="158" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 99</text>
<text x="814" y="212" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="440,160 570,158" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="570,158 556.1093360759868,165.21453087526268 555.893976945382,151.21618738594705" fill="#1f5f85"/>
<text x="660" y="60" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">old</text>
<polyline points="660,82 660,130" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="660,130 653.0,116.0 667.0,116.0" fill="#1f5f85"/>
<polyline points="30,345 1570,345" fill="none" stroke="#d8dfe5" stroke-width="4" stroke-linejoin="round"/>
<text x="40" y="385" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">2. Advance top</text>
<text x="40" y="427" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">top = top-&gt;next</text>
<rect x="340" y="480" width="160" height="110" fill="white" stroke="#10293b" stroke-width="3"/>
