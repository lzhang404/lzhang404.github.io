<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">Subset search tree with adding and undoing</title>
<desc id="desc">Start with the empty set. Each downward blue arrow adds a later input element. Each upward orange arrow removes the element that was added. For example, returning from {1,2} to {1} removes 2, allowing the next branch to add 3 and form {1,3}. Every node is a subset and is recorded when first reached, including the root. The output order is {}, {1}, {1,2}, {1,2,3}, {1,3}, {2}, {2,3}, {3}.</desc>
<rect width="1500" height="700" fill="white"/>
<defs><marker id="add" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4a64"/></marker>
<marker id="undo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0662e"/></marker></defs>
<path d="M 715.0 97 L 373 203" fill="none" stroke="#2f4a64" stroke-width="2.5" marker-end="url(#add)"/>
<path d="M 387 203 L 729.0 97" fill="none" stroke="#d0662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<path d="M 743.0 97 L 873 203" fill="none" stroke="#2f4a64" stroke-width="2.5" marker-end="url(#add)"/>
<path d="M 887 203 L 757.0 97" fill="none" stroke="#d0662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<path d="M 771.0 97 L 1273 203" fill="none" stroke="#2f4a64" stroke-width="2.5" marker-end="url(#add)"/>
<path d="M 1287 203 L 785.0 97" fill="none" stroke="#d0662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<path d="M 353.0 257 L 183 368" fill="none" stroke="#2f4a64" stroke-width="2.5" marker-end="url(#add)"/>
<path d="M 197 368 L 367.0 257" fill="none" stroke="#d0662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<path d="M 393.0 257 L 563 368" fill="none" stroke="#2f4a64" stroke-width="2.5" marker-end="url(#add)"/>
<path d="M 577 368 L 407.0 257" fill="none" stroke="#d0662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<path d="M 873.0 257 L 873 368" fill="none" stroke="#2f4a64" stroke-width="2.5" marker-end="url(#add)"/>
<path d="M 887 368 L 887.0 257" fill="none" stroke="#d0662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<path d="M 183.0 422 L 183 518" fill="none" stroke="#2f4a64" stroke-width="2.5" marker-end="url(#add)"/>
<path d="M 197 518 L 197.0 422" fill="none" stroke="#d0662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<rect x="670.0" y="43" width="160" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="750" y="81" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{}</text>
<rect x="300.0" y="203" width="160" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="380" y="241" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{1}</text>
<rect x="800.0" y="203" width="160" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="880" y="241" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{2}</text>
<rect x="1200.0" y="203" width="160" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="1280" y="241" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{3}</text>
<rect x="110.0" y="368" width="160" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="190" y="406" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{1,2}</text>
<rect x="490.0" y="368" width="160" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="570" y="406" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{1,3}</text>
<rect x="800.0" y="368" width="160" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="880" y="406" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{2,3}</text>
<rect x="95.0" y="518" width="190" height="54" rx="5" fill="#eaf0f4" stroke="#94a3b8" stroke-width="2"/>
<text x="190" y="556" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" font-weight="400" fill="#111827" text-anchor="middle">{1,2,3}</text>
<text x="25" y="29" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#626b73" text-anchor="start">Current subset</text>
<path d="M 75 605 V 645" fill="none" stroke="#2f4a64" stroke-width="3" marker-end="url(#add)"/>
<text x="105" y="635" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#2f4a64" text-anchor="start">Add a later input element</text>
<path d="M 720 645 V 605" fill="none" stroke="#d0662e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#undo)"/>
<text x="750" y="635" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#d0662e" text-anchor="start">Undo the last addition</text>
<text x="750" y="687" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#111827" text-anchor="middle">Record every node when first reached, including the empty set.</text>
</svg>