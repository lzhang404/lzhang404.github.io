<svg xmlns="http://www.w3.org/2000/svg" width="920" height="342" viewBox="18 -8 920 342" role="img" aria-labelledby="title desc">
<title id="title">Queue inserts at the rear and removes from the front</title>
<desc id="desc">Blue shows existing items. Orange shows the item or pointer changed in this step.</desc>
<rect x="18" y="-8" width="920" height="342" fill="white"/>
<text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">FIFO order: 1 is removed first</text>
<rect x="40" y="130" width="160" height="90" fill="white" stroke="#10293b" stroke-width="3"/>
<text x="54" y="155" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">front:</text>
<text x="54" y="195" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">rear:</text>
<rect x="270" y="130" width="180" height="90" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<polyline points="270,175 450,175" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="284" y="153" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 1</text>
<text x="284" y="197" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next:</text>
<polyline points="355,197 500,197" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="500,197 486.0,204.0 486.0,190.0" fill="#1f5f85"/>
<rect x="500" y="130" width="180" height="90" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<polyline points="500,175 680,175" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="514" y="153" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 2</text>
<text x="514" y="197" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next:</text>
<polyline points="585,197 730,197" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="730,197 716.0,204.0 716.0,190.0" fill="#1f5f85"/>
<rect x="730" y="130" width="180" height="90" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<polyline points="730,175 910,175" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="744" y="153" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 3</text>
<text x="744" y="197" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="140,155 270,153" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="270,153 256.1093360759868,160.21453087526268 255.89397694538195,146.21618738594705" fill="#1f5f85"/>
<polyline points="140,195 235,195 235,260 820,260 820,220" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="820,220 827.0,234.0 813.0,234.0" fill="#1f5f85"/>
<text x="40" y="295" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">length: 3</text>
</svg>

