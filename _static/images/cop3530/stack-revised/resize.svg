<polyline points="30,800 1570,800" fill="none" stroke="#d8dfe5" stroke-width="4" stroke-linejoin="round"/>
<text x="40" y="850" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">2. Store 13 and increase size</text>
<text x="520.0" y="920" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">0</text>
<rect x="430" y="950" width="180" height="95" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="520.0" y="997" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">12</text>
<text x="700.0" y="920" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">1</text>
<rect x="610" y="950" width="180" height="95" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="700.0" y="997" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="880.0" y="920" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">2</text>
<rect x="790" y="950" width="180" height="95" fill="#fcd9a3" stroke="#10293b" stroke-width="3"/>
<text x="880.0" y="997" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">13</text>
<text x="1060.0" y="920" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<rect x="970" y="950" width="180" height="95" fill="#eef1f4" stroke="#10293b" stroke-width="3"/>
<text x="40" y="1110" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">capacity = 4     size = 3</text>
<text x="880.0" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">top</text>
<polyline points="880.0,1155 880.0,1045" fill="none" stroke="#e8730c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="880.0,1045 887.0,1059.0 873.0,1059.0" fill="#e8730c"/>
</svg>
