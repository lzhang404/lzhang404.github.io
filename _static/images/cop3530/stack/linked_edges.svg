<svg xmlns="http://www.w3.org/2000/svg" width="617" height="859" viewBox="18 -8 617 859" role="img" aria-labelledby="title desc">
<title id="title">Empty and one-node stack cases</title>
<desc id="desc">Blue shows existing items. Orange shows the item or pointer changed in this step.</desc>
<rect x="18" y="-8" width="617" height="859" fill="white"/>
<text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">push(71) into an empty stack</text>
<text x="40" y="77" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">The new node has next = nullptr</text>
<rect x="40" y="160" width="160" height="90" fill="white" stroke="#10293b" stroke-width="3"/>
<text x="54" y="185" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">top:</text>
<text x="54" y="225" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">length: 1</text>
<rect x="270" y="160" width="180" height="90" fill="#fcd9a3" stroke="#10293b" stroke-width="3"/>
<polyline points="270,205 450,205" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="284" y="183" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 71</text>
<text x="284" y="227" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="140,185 270,183" fill="none" stroke="#e8730c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="270,183 256.1093360759868,190.21453087526268 255.89397694538195,176.21618738594705" fill="#e8730c"/>
<polyline points="38,267 615,267" fill="none" stroke="#d8dfe5" stroke-width="4"/>
<text x="40" y="302" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">pop() removes the only node</text>
<text x="40" y="344" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">top becomes nullptr; length becomes 0</text>
<rect x="40" y="427" width="160" height="90" fill="white" stroke="#10293b" stroke-width="3"/>
<text x="54" y="452" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">top:</text>
<text x="54" y="492" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">length: 0</text>
<rect x="270" y="427" width="180" height="90" fill="#eef1f4" stroke="#10293b" stroke-width="3" stroke-dasharray="9 6"/>
<polyline points="270,472 450,472" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="284" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#73899a" text-anchor="start" dominant-baseline="middle">val: 71</text>
<text x="284" y="494" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="275,432 445,512" fill="none" stroke="#b42318" stroke-width="4" stroke-linejoin="round"/>
<polyline points="445,432 275,512" fill="none" stroke="#b42318" stroke-width="4" stroke-linejoin="round"/>
<text x="360" y="547" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#b42318" text-anchor="middle" dominant-baseline="middle">freed</text>
<text x="116" y="452" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#e8730c" text-anchor="start" dominant-baseline="middle">nullptr</text>
<polyline points="38,578.8 615,578.8" fill="none" stroke="#d8dfe5" stroke-width="4"/>
<text x="40" y="613.8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">pop() or peek() on an empty stack</text>
<text x="40" y="655.8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">The empty check throws before dereferencing top</text>
<rect x="40" y="738.8" width="160" height="90" fill="white" stroke="#10293b" stroke-width="3"/>
<text x="54" y="763.8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">top:</text>
<text x="54" y="803.8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">length: 0</text>
<text x="116" y="763.8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">nullptr</text>
</svg>

