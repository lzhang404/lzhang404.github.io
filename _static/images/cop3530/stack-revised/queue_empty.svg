<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="765" viewBox="0 0 1600 765" role="img" aria-labelledby="title desc">
<title id="title">Queue empty and last-node cases</title>
<desc id="desc">Blue shows existing items. Orange shows the item or pointer changed in this step.</desc>
<rect width="1600" height="765" fill="white"/>
<text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">Enqueue into an empty queue</text>
<rect x="340" y="130" width="160" height="110" fill="white" stroke="#10293b" stroke-width="3"/>
<text x="354" y="160" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">front:</text>
<text x="354" y="200" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">rear:</text>
<rect x="570" y="130" width="180" height="110" fill="#fcd9a3" stroke="#10293b" stroke-width="3"/>
<polyline points="570,182 750,182" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="584" y="158" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 1</text>
<text x="584" y="212" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="440,160 570,158" fill="none" stroke="#e8730c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="570,158 556.1093360759868,165.21453087526268 555.893976945382,151.21618738594705" fill="#e8730c"/>
<polyline points="440,200 535,200 535,290 660,290 660,240" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="660,240 667.0,254.0 653.0,254.0" fill="#1f5f85"/>
<text x="340" y="325" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">size_: 1</text>
<polyline points="30,345 1570,345" fill="none" stroke="#d8dfe5" stroke-width="4" stroke-linejoin="round"/>
<text x="40" y="385" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">Dequeue the only node</text>
<text x="40" y="427" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">Both front and rear become nullptr</text>
<rect x="340" y="480" width="160" height="110" fill="white" stroke="#10293b" stroke-width="3"/>
<text x="354" y="510" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">front:</text>
<text x="354" y="550" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">rear:</text>
<rect x="570" y="480" width="180" height="110" fill="#eef1f4" stroke="#10293b" stroke-width="3" stroke-dasharray="9 6"/>
<polyline points="570,532 750,532" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="584" y="508" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#73899a" text-anchor="start" dominant-baseline="middle">val: 1</text>
<text x="584" y="562" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="575,485 745,585" fill="none" stroke="#b42318" stroke-width="4" stroke-linejoin="round"/>
<polyline points="745,485 575,585" fill="none" stroke="#b42318" stroke-width="4" stroke-linejoin="round"/>
<text x="660" y="620" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#b42318" text-anchor="middle" dominant-baseline="middle">freed</text>
<text x="416" y="510" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">nullptr</text>
<text x="416" y="550" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">nullptr</text>
<text x="340" y="675" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">size_: 0</text>
</svg>
