<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc"><title id="title">Remove the maximum from a max-heap</title><desc id="desc">Step 0: save the maximum. Save 90 to return. The last value is 80. Array: 90, 88, 55, 33, 80. Step 1: replace the root. Remove the old last position. Larger child: 88. Since 80 &lt; 88, swap. Array: 80, 88, 55, 33. Step 2: swap with 88. 80 &gt;= 33: stop. Return 90. 88 is the new maximum. Array: 88, 80, 55, 33.</desc><rect width="1500" height="600" fill="white" /><rect x="8" y="8" width="1484" height="540" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="26" y="38" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111827"><tspan font-weight="400">Step 0:</tspan><tspan font-family="Menlo, Consolas, 'Courier New', monospace" dx="10">save the maximum</tspan></text><text x="26" y="78" dominant-baseline="middle" text-anchor="start" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="23" font-weight="400" fill="#111827">maximum = heap[0];</text><g data-source="remove_01_initial.svg" transform="translate(74.97619047619048,98) scale(0.8928571428571429)">

