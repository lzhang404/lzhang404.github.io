<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">Permutation decision tree with choosing and undoing</title>
<desc id="desc">The root is an empty prefix. Blue downward arrows choose a letter. Orange upward arrows undo that choice. Children must all be explored before returning to their parent. The complete leaves, left to right, are ABC, ACB, BAC, BCA, CBA, CAB.</desc>
