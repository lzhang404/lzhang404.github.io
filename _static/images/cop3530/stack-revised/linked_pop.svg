<text x="814" y="858" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 99</text>
<text x="814" y="912" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="440,860 525,860 525,805 840,805 840,830" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
