<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Selection Sort Visualizer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>Selection Sort Interactive Visualizer</header>

  <main>
    <section class="panel lesson-panel">
      <div class="controls">
        <div>
          <label for="array-input">Array values (comma or space separated)</label>
          <input id="array-input" type="text" value="64, 25, 12, 22, 11" />
        </div>
        <div class="button-row">
          <button id="start-btn">Start</button>
          <button id="toggle-btn" disabled>Pause</button>
          <button id="reset-btn">Reset</button>
        </div>
        <div class="message" id="message"></div>
      </div>

      <div class="legend">
        <h2>Legend</h2>
        <div class="legend-grid">
          <div class="legend-item">
            <span class="legend-swatch min"></span>
            <span>Current minimum</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch swap"></span>
            <span>Swapping elements</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch sorted"></span>
            <span>Sorted section</span>
          </div>
        </div>
      </div>

      <div class="visualization">
        <h2>Array State</h2>
        <div class="array-container" id="array-container"></div>
      </div>
    </section>

    <section class="panel code-panel">
      <h2>C++ Selection Sort</h2>
      <pre id="code-block"></pre>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
