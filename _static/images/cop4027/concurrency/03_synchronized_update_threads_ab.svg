    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 275"
         role="img"
         aria-labelledby="safe-trace-title safe-trace-desc"
         style="display:block; width:96%; max-height:300px; margin:16px auto;">

      <title id="safe-trace-title">A lock prevents the lost update</title>

      <desc id="safe-trace-desc">
        Time moves right. Thread A holds the lock while reading 0 and writing 1.
        Thread B waits, then holds the same lock while reading 1 and writing 2.
      </desc>

      <g font-family="Source Sans Pro, Helvetica, sans-serif"
         font-size="30"
         fill="#2d2a26">

        <text x="25" y="90">Thread A</text>
        <text x="25" y="205">Thread B</text>

        <rect x="220" y="42" width="545" height="75" rx="6"
              fill="#f8dac5" stroke="#2f4a64" stroke-width="3" />

        <text x="245" y="90">Lock → read 0 → write 1 → unlock</text>

        <text x="340" y="205" fill="#666">Wait for the same lock</text>

        <rect x="800" y="157" width="610" height="75" rx="6"
              fill="#dbe8f1" stroke="#2f4a64" stroke-width="3" />

        <text x="825" y="205">Lock → read 1 → write 2 → unlock</text>

        <path d="M220,250 H1400" stroke="#2f4a64" stroke-width="3" />
        <text x="1190" y="274">Time →</text>

      </g>
    </svg>
