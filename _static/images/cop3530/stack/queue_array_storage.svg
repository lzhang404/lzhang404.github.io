<svg xmlns="http://www.w3.org/2000/svg" width="487" height="327" viewBox="3 -17 487 327" role="img" aria-labelledby="title desc">
<title id="title">Array storage and FIFO queue order</title>
<desc id="desc">Front and rear label the active endpoint cells directly in each array. Blue cells hold active queue items. Gray cells are outside the queue.</desc>
<rect x="3" y="-17" width="487" height="327" fill="white"/>
<text xml:space="preserve" x="25" y="24" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">Array storage</text>
<text xml:space="preserve" x="73.0" y="59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">0</text>
<rect x="25" y="79" width="96" height="74" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text xml:space="preserve" x="73.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<text xml:space="preserve" x="169.0" y="59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">1</text>
<rect x="121" y="79" width="96" height="74" fill="#eef1f4" stroke="#10293b" stroke-width="3"/>
<text xml:space="preserve" x="265.0" y="59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">2</text>
<rect x="217" y="79" width="96" height="74" fill="#a8c9eb" stroke="#e8730c" stroke-width="3"/>
<text xml:space="preserve" x="265.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">1</text>
<text xml:space="preserve" x="361.0" y="59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<rect x="313" y="79" width="96" height="74" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text xml:space="preserve" x="361.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">2</text>
<text xml:space="preserve" x="265" y="180" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">front</text>
<text xml:space="preserve" x="73" y="180" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">rear</text>
<text xml:space="preserve" x="25" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">allocationSize = 4   length = 3   frontIndex = 2</text>
<text xml:space="preserve" x="25" y="274.4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">Gray cells are outside the active queue.</text>
</svg>

