<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-label="Recursion tree for T(N) = k + T(N/2): a chain of nodes each doing k work, about log base 2 of N levels deep" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- connectors -->
  <g stroke="#333" stroke-width="1.6">
    <line x1="105" y1="58"  x2="105" y2="92"/>
    <line x1="105" y1="128" x2="105" y2="162"/>
    <line x1="105" y1="198" x2="105" y2="226"/>
    <line x1="105" y1="256" x2="105" y2="282"/>
  </g>

  <!-- nodes -->
  <g fill="#fff" stroke="#333" stroke-width="1.8">
    <ellipse cx="105" cy="40"  rx="26" ry="18"/>
    <ellipse cx="105" cy="110" rx="26" ry="18"/>
    <ellipse cx="105" cy="180" rx="26" ry="18"/>
    <ellipse cx="105" cy="300" rx="26" ry="18"/>
  </g>
  <g fill="#333" font-size="16" text-anchor="middle">
    <text x="105" y="46">k</text>
    <text x="105" y="116">k</text>
    <text x="105" y="186">k</text>
    <text x="105" y="306">k</text>
  </g>

  <!-- vertical dots -->
  <g fill="#333">
    <circle cx="105" cy="234" r="2.2"/>
    <circle cx="105" cy="241" r="2.2"/>
    <circle cx="105" cy="248" r="2.2"/>
  </g>

  <!-- range size on the left -->
  <g fill="#555" font-size="13" text-anchor="end">
    <text x="62" y="20" font-size="11" fill="#888">range</text>
    <text x="62" y="45">N</text>
    <text x="62" y="115">N / 2</text>
    <text x="62" y="185">N / 4</text>
    <text x="62" y="305">1</text>
  </g>

  <!-- height bracket -->
  <g stroke="#666" stroke-width="1.4" fill="none">
    <line x1="176" y1="22" x2="176" y2="318"/>
    <line x1="176" y1="22" x2="168" y2="22"/>
    <line x1="176" y1="318" x2="168" y2="318"/>
  </g>
  <g fill="#555" font-size="14" text-anchor="start">
    <text x="186" y="165">log<tspan dy="4" font-size="0.72em">2</tspan><tspan dy="-4"> N</tspan></text>
    <text x="186" y="184">levels</text>
  </g>
</svg>
