<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc"><title id="title">First partitions and Remaining partitions</title><desc id="desc">Read down the left column, then down the right column. Hoare partition first splits at index 2, producing 7, 3, 2 and 8, 9. Recursive calls sort each smaller range. The final array is 2, 3, 7, 8, 9.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#e8730c"/></marker></defs><rect width="1400" height="690" fill="white"/><rect x="8" y="8" width="1384" height="674" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="20" y="20" width="660" height="650" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="38" y="54" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">First partitions</text><rect x="720" y="20" width="660" height="650" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="738" y="54" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Remaining partitions</text><text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 0: Start</text><text x="38" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Choose the middle value: pivot = 8</text><rect x="100" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="150" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">9</text><rect x="200" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="250" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="300" y="182" width="100" height="62" rx="0" fill="#fcd9a3" stroke="#10293b" stroke-width="3"/><text x="350" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">8</text><rect x="400" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="450" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="500" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="550" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><line x1="38" y1="264" x2="662" y2="264" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="38" y="290" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 1: Partition around 8</text><text x="38" y="332" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Left ≤ 8, right ≥ 8</text><rect x="88" y="372" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="138" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="188" y="372" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="238" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="288" y="372" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="338" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="412" y="372" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="462" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">8</text><rect x="512" y="372" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="562" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">9</text><line x1="38" y1="454" x2="662" y2="454" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="38" y="480" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 2: Partition the left range</text><text x="38" y="522" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Pivot = 3 gives [2, 3] and [7]</text><rect x="76" y="562" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="126" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="176" y="562" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="226" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="300" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="350" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="424" y="562" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="474" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">8</text><rect x="524" y="562" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="574" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">9</text><text x="738" y="100" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 3: Partition [2, 3]</text><text x="738" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Pivot = 2 gives [2] and [3]</text><rect x="764" y="182" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="814" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="888" y="182" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="938" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="1012" y="182" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1062" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="1136" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="1186" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">8</text><rect x="1236" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="1286" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">9</text><line x1="738" y1="264" x2="1362" y2="264" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="738" y="290" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 4: Partition [8, 9]</text><text x="738" y="332" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Pivot = 8 gives [8] and [9]</text><rect x="752" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="802" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="876" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="926" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="1000" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1050" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="1124" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1174" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">8</text><rect x="1248" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1298" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">9</text><line x1="738" y1="454" x2="1362" y2="454" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="738" y="480" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 5: Finish</text><text x="738" y="522" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Every recursive range has one item</text><rect x="800" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="850" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="900" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="950" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="1000" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1050" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="1100" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1150" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">8</text><rect x="1200" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1250" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">9</text></svg>
