<svg xmlns="http://www.w3.org/2000/svg" width="829" height="514" viewBox="8 -13 829 514" role="img" aria-labelledby="title desc">
<title id="title">Peek reads the top without removing it</title>
<desc id="desc">Blue shows existing items. Orange shows the item or pointer changed in this step.</desc>
<rect x="8" y="-13" width="829" height="514" fill="white"/>
<text x="30" y="30" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">Before peek()</text>
<rect x="95" y="285" width="300" height="115" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="245" y="343" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">mosquito</text>
<rect x="95" y="160" width="300" height="115" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="245" y="218" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">fish</text>
<text x="245" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">top</text>
<polyline points="245,115 245,160" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="245,160 238.0,146.0 252.0,146.0" fill="#1f5f85"/>
<text x="245" y="460" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">length = 2</text>
<text x="450" y="30" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">peek() returns "fish"</text>
<rect x="515" y="285" width="300" height="115" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="665" y="343" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">mosquito</text>
<rect x="515" y="160" width="300" height="115" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="665" y="218" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">fish</text>
<text x="665" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">top</text>
<polyline points="665,115 665,160" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="665,160 658.0,146.0 672.0,146.0" fill="#1f5f85"/>
<text x="665" y="460" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">length = 2</text>
</svg>

