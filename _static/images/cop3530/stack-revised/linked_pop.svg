<polyline points="570,882 750,882" fill="none" stroke="#73899a" stroke-width="4" stroke-linejoin="round"/>
<text x="584" y="858" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#73899a" text-anchor="start" dominant-baseline="middle">val: 71</text>
<text x="584" y="912" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next:</text>
