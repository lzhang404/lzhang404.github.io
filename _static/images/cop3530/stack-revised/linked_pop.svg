<text x="814" y="508" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">val: 99</text>
<text x="814" y="562" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">next: nullptr</text>
<polyline points="440,510 525,510 525,455 840,455 840,480" fill="none" stroke="#e8730c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="840,480 833.0,466.0 847.0,466.0" fill="#e8730c"/>
