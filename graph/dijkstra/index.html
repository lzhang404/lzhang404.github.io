<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Dijkstra Graph Visualizer</title>
  <link rel="stylesheet" href="../../shared/code-styles.css" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header>Dijkstra&rsquo;s Algorithm Visualizer</header>
  <nav><a class="back-link" href="../index.html">&larr; Back to graph hub</a></nav>
  <main>
    <div class="visualizer-layout">
      <section class="panel graph-panel">
        <div class="controls">
          <div class="field">
            <label for="edge-input">Weighted edges (format: <code>U V W</code>)</label>
            <textarea id="edge-input" spellcheck="false"></textarea>
          </div>
          <div class="field field-inline">
            <label for="start-node">Start node</label>
            <input id="start-node" type="text" value="A" maxlength="12" />
            <label><input id="directed-toggle" type="checkbox" checked /> Treat as directed</label>
          </div>
          <div class="button-row">
            <button id="start-btn">Start</button>
            <button id="step-btn">Step</button>
            <button id="toggle-btn" disabled>Pause</button>
            <button id="reset-btn">Reset</button>
          </div>
          <div class="message" id="message"></div>
        </div>

        <div class="graph-wrapper">
          <svg id="graph-canvas" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <div class="step-info" id="step-info"></div>
        <div class="structure-row">
          <div class = "structure">
            <h2 id="structure-label">Priority queue (min distance first)</h2>
            <div class="structure-items" id="structure-items"></div>
          </div>

          <div class="structure secondary">
            <h2 id="secondary-label">Settled nodes</h2>
            <div class="structure-items" id="secondary-items"></div>
          </div>
        </div>

        <div class="legend">
          <h2>Legend</h2>
          <div class="legend-grid">
            <div class="legend-item"><span class="legend-swatch source"></span><span>Start node</span></div>
            <div class="legend-item"><span class="legend-swatch current"></span><span>Node u</span></div>
            <div class="legend-item"><span class="legend-swatch frontier"></span><span>Nodes in priority queue</span></div>
            <div class="legend-item"><span class="legend-swatch candidate"></span><span>Edge target being relaxed</span></div>
            <div class="legend-item"><span class="legend-swatch visited"></span><span>Settled nodes</span></div>
            <div class="legend-item"><span class="legend-swatch relaxed"></span><span>Edge in shortest-path tree</span></div>
          </div>
        </div>
      </section>

      <div class="side-column">
        <section class="panel distances">
          <h2>Distances</h2>
          <table class="distance-table">
            <thead>
              <tr>
                <th>Node</th>
                <th>Dist</th>
                <th>Previous</th>
              </tr>
            </thead>
            <tbody id="distance-body"></tbody>
          </table>
        </section>

        <section class="panel code-panel">
          <h2>C++ Dijkstra</h2>
          <pre id="code-block"></pre>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="../src/dijkstra.js"></script>
</body>
</html>
