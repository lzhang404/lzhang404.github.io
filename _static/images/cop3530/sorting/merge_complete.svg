<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc"><title id="title">Divide and sort left and Sort right and combine</title><desc id="desc">Read down the left column and then the right column. Divide 7, 3, 5, 2 into halves. Recursively divide and merge the left half first. Then recursively divide and merge the right half. Finally merge 3, 7 and 2, 5 into 2, 3, 5, 7. This follows the left-first call order of the code.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#e8730c"/></marker></defs><rect width="1400" height="690" fill="white"/><rect x="8" y="8" width="1384" height="674" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="20" y="20" width="660" height="650" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="38" y="54" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Divide and sort left</text><rect x="720" y="20" width="660" height="650" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="738" y="54" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Sort right and combine</text><text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 0: Divide [7, 3, 5, 2]</text><text x="38" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Split the input into two halves</text><rect x="138" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="188" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="238" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="288" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="362" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="412" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">5</text><rect x="462" y="182" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="512" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><line x1="38" y1="264" x2="662" y2="264" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="38" y="290" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 1: Divide the left half</text><text x="38" y="332" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">[5, 2] waits while [7, 3] splits</text><rect x="126" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="176" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="250" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="300" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="374" y="372" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="424" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">5</text><rect x="474" y="372" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="524" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><line x1="38" y1="454" x2="662" y2="454" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="38" y="480" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 2: Merge 7 and 3</text><text x="38" y="522" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">The left half becomes [3, 7]</text><rect x="138" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="188" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="238" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="288" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="362" y="562" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="412" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">5</text><rect x="462" y="562" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="512" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><text x="738" y="100" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 3: Divide the right half</text><text x="738" y="142" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">[3, 7] waits while [5, 2] splits</text><rect x="826" y="182" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="876" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="926" y="182" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="976" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="1050" y="182" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1100" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">5</text><rect x="1174" y="182" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1224" y="213" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><line x1="738" y1="264" x2="1362" y2="264" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="738" y="290" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 4: Merge 5 and 2</text><text x="738" y="332" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">The right half becomes [2, 5]</text><rect x="838" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="888" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="938" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="988" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="1062" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1112" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="1162" y="372" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1212" y="403" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">5</text><line x1="738" y1="454" x2="1362" y2="454" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="738" y="480" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 5: Merge the pairs</text><text x="738" y="522" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Take 2, then 3, then 5, then 7</text><rect x="850" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="900" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="950" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1000" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="1050" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1100" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">5</text><rect x="1150" y="562" width="100" height="62" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="1200" y="593" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text></svg>
