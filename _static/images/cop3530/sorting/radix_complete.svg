<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc"><title id="title">Two stable radix passes</title><desc id="desc">Read down the ones column, then down the tens column. Distribute 21, 13, 12, 23 by ones digit and gather 21, 12, 13, 23. Distribute that result by tens digit and gather 12, 13, 21, 23. Only nonempty buckets are drawn. Arrival order is preserved inside each bucket.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#e8730c"/></marker></defs><rect width="1400" height="690" fill="white"/><rect x="8" y="8" width="1384" height="674" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="20" y="20" width="660" height="650" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="38" y="54" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Ones digit</text><rect x="720" y="20" width="660" height="650" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="738" y="54" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Tens digit</text><text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 0: Read the array</text><rect x="150" y="148" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="200" y="179" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">21</text><rect x="250" y="148" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="300" y="179" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">13</text><rect x="350" y="148" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="400" y="179" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">12</text><rect x="450" y="148" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="500" y="179" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">23</text><line x1="38" y1="236" x2="662" y2="236" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="38" y="272" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 1: Fill digit buckets</text><text x="38" y="310" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#111827" text-anchor="start" dominant-baseline="middle">Nonempty buckets in digit order</text><text x="180" y="350" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="middle" dominant-baseline="middle">1</text><rect x="110" y="374" width="140" height="112" rx="0" fill="white" stroke="#94a3b8" stroke-width="2"/><rect x="114" y="378" width="132" height="48" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="2"/><text x="180" y="402" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">21</text><text x="340" y="350" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="270" y="374" width="140" height="112" rx="0" fill="white" stroke="#94a3b8" stroke-width="2"/><rect x="274" y="378" width="132" height="48" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="2"/><text x="340" y="402" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">12</text><text x="500" y="350" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="430" y="374" width="140" height="112" rx="0" fill="white" stroke="#94a3b8" stroke-width="2"/><rect x="434" y="378" width="132" height="48" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="2"/><text x="500" y="402" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">13</text><rect x="434" y="430" width="132" height="48" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="2"/><text x="500" y="454" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">23</text><line x1="38" y1="508" x2="662" y2="508" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="38" y="545" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 2: Gather in bucket order</text><rect x="150" y="590" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="200" y="621" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">21</text><rect x="250" y="590" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="300" y="621" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">12</text><rect x="350" y="590" width="100" height="62" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="400" y="621" font-f