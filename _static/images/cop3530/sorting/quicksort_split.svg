<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">Hoare partition with pivot 8</title><desc id="desc">The next scan stops at 8 and 2. Swap and advance the cursors. They cross, so return j = 2. The left range is 7, 3, 2. The right range is 8, 9. The split index is not the pivot position.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#e8730c"/></marker></defs><rect width="1400" height="700" fill="white"/><rect x="8" y="8" width="1384" height="684" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="36" y="42" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#111827" text-anchor="start" dominant-baseline="middle">Saved pivot value = 8</text><text x="36" y="166" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 3: Scan inward</text><rect x="530" y="132" width="152" height="70" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="606" y="167" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="682" y="132" width="152" height="70" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="758" y="167" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="834" y="132" width="152" height="70" rx="0" fill="#fcd9a3" stroke="#10293b" stroke-width="3"/><text x="910" y="167" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">8</text><rect x="986" y="132" width="152" height="70" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="1062" y="167" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><rect x="1138" y="132" width="152" height="70" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="1214" y="167" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">9</text><text x="606" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">0</text><text x="758" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">1</text><text x="910" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">2</text><text x="1062" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">3</text><text x="1214" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">4</text><text x="910" y="90" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e8730c" text-anchor="middle" dominant-baseline="middle">i</text><path d="M910,107 L910,129" fill="none" stroke="#e8730c" stroke-width="4" marker-end="url(#arrow)"/><text x="1062" y="90" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e8730c" text-anchor="middle" dominant-baseline="middle">j</text><path d="M1062,107 L1062,129" fill="none" stroke="#e8730c" stroke-width="4" marker-end="url(#arrow)"/><line x1="24" y1="258" x2="1376" y2="258" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="36" y="360" font-family="Arial, Helvetica, sans-se