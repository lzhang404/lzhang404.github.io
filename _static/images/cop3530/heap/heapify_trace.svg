<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc"><title id="title">Build a max-heap from an unsorted array</title><desc id="desc">Step 0: input array. Leaves need no repair. Process indices 2, 1, then 0. Array: 77, 55, 92, 67, 98, 24, 42. Step 1: i = 2. 92 &gt;= 24 and 92 &gt;= 42. No swap is needed. Array: 77, 55, 92, 67, 98, 24, 42. Step 2: i = 1. Swap 55 with 98. 55 reaches a leaf: stop. Array: 77, 98, 92, 67, 55, 24, 42. Step 3: i = 0. Swap 77 with 98. 77 &gt;= 67 and 55: stop. Array: 98, 77, 92, 67, 55, 24, 42.</desc><rect width="1500" height="600" fill="white" /><rect x="8" y="8" width="1484" height="540" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="26" y="38" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111827"><tspan font-weight="400">Step 0:</tspan><tspan font-family="Menlo, Consolas, 'Courier New', monospace" dx="10">input array</tspan></text><text x="26" y="78" dominant-baseline="middle" text-anchor="start" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="23" font-weight="400" fill="#111827">n = 7; // last parent: 2</text><g data-source="heapify_01_input.svg" transform="translate(26,98) scale(0.8292079207920792)">

