" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><line x1="24" y1="192" x2="1376" y2="192" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="36" y="254" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 1: Insert 3</text><rect x="650" y="218" width="150" height="72" rx="0" fill="#bfe3c6" stroke="#e8730c" stroke-width="5"/><text x="725" y="254" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">3</text><rect x="800" y="218" width="150" height="72" rx="0" fill="#bfe3c6" stroke="#e8730c" stroke-width="5"/><text x="875" y="254" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">7</text><rect x="950" y="218" width="150" height="72" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="1025" y="254" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">5</text><rect x="1100" y="218" width="150" height="72" rx="0" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/><text x="1175" y="254" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">2</text><line x1="24" y1="320" x2="1376" y2="320" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/><text x="36" y="382" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">Step 2: Insert 5</text><rect x="650" y="346" width="150" height="72" rx="0" fill="#bfe3c6" stroke="#10293b" stroke-width="3"/><text x="725" y="382" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#111827" text-anchor="middle" dominant-base