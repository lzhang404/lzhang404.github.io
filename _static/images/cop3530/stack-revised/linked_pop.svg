<polyline points="30,695 1570,695" fill="none" stroke="#d8dfe5" stroke-width="4" stroke-linejoin="round"/>
<text x="40" y="735" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">3. Delete old and update size</text>
<text x="40" y="777" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">delete old; --size_</text>
<rect x="340" y="830" width="160" height="110" fill="white" stroke="#10293b" stroke-width="3"/>
