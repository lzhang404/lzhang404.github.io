<text x="244.0" y="292.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#111827">F</text>
</g><text x="902" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#111827">Not complete</text><g transform="translate(680,65) scale(1.1)"><line x1="202.0" y1="100.0" x2="118.0" y2="154.0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
