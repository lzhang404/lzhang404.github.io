<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1380" viewBox="0 0 700 1380" role="img" aria-labelledby="title desc">
  <title id="title">Divide and sort left and Sort right and combine</title>
  <desc id="desc">Read the numbered steps from top to bottom. Divide 7, 3, 5, 2 into halves. Recursively divide and merge the left half first. Then recursively divide and merge the right half. Finally merge 3, 7 and 2, 5 into 2, 3, 5, 7. This follows the left-first call order of the code.</desc>
