<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">A basic array queue shifts its active values</title>
<desc id="desc">Blue shows existing items. Orange shows the item or pointer changed in this step.</desc>
<rect width="1600" height="860" fill="white"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">Before dequeue(): front is at index 0</text>
<text x="520.0" y="120" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">0</text>
<rect x="430" y="150" width="180" height="95" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="520.0" y="197" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="700.0" y="120" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">1</text>
<rect x="610" y="150" width="180" height="95" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="700.0" y="197" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="880.0" y="120" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">2</text>
<rect x="790" y="150" width="180" height="95" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="880.0" y="197" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="1060.0" y="120" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<rect x="970" y="150" width="180" height="95" fill="#eef1f4" stroke="#10293b" stroke-width="3"/>
<text x="40" y="310" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">capacity = 4     size = 3</text>
<text x="880.0" y="380" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">rear</text>
<polyline points="880.0,355 880.0,245" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="880.0,245 887.0,259.0 873.0,259.0" fill="#1f5f85"/>
<text x="574.0" y="85" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">front</text>
<polyline points="574.0,108 574.0,150" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="574.0,150 567.0,136.0 581.0,136.0" fill="#1f5f85"/>
<polyline points="30,400 1570,400" fill="none" stroke="#d8dfe5" stroke-width="4" stroke-linejoin="round"/>
<text x="40" y="450" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#10293b" text-anchor="start" dominant-baseline="middle">After removing 1 and shifting left</text>
<text x="520.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">0</text>
<rect x="430" y="550" width="180" height="95" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="520.0" y="597" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="700.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">1</text>
<rect x="610" y="550" width="180" height="95" fill="#a8c9eb" stroke="#10293b" stroke-width="3"/>
<text x="700.0" y="597" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="880.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">2</text>
<rect x="790" y="550" width="180" height="95" fill="#eef1f4" stroke="#10293b" stroke-width="3"/>
<text x="880.0" y="597" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#7b8791" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="1060.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="middle" dominant-baseline="middle">3</text>
<rect x="970" y="550" width="180" height="95" fill="#eef1f4" stroke="#10293b" stroke-width="3"/>
<text x="40" y="710" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#10293b" text-anchor="start" dominant-baseline="middle">capacity = 4     size = 2</text>
<text x="700.0" y="780" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">rear</text>
<polyline points="700.0,755 700.0,645" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="700.0,645 707.0,659.0 693.0,659.0" fill="#1f5f85"/>
<text x="574.0" y="485" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#10293b" text-anchor="middle" dominant-baseline="middle">front</text>
<polyline points="574.0,508 574.0,550" fill="none" stroke="#1f5f85" stroke-width="4" stroke-linejoin="round"/>
<polygon points="574.0,550 567.0,536.0 581.0,536.0" fill="#1f5f85"/>
</svg>
