<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="heap-types-title heap-types-desc"><title id="heap-types-title">Max-heap and min-heap comparison</title><desc id="heap-types-desc">The left tree is a max-heap: every parent is at least as large as its children, and the maximum 88 is at the root. Its level-order values are 88,80,55,33,72,24,41. The right tree is a min-heap: every parent is at most as large as its children, and the minimum 33 is at the root. Its values are 33,48,51,60,70,72,90.</desc><rect width="1200" height="470" fill="#ffffff" /><text x="302.20000000000005" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#111827">Max-heap</text><text x="302.20000000000005" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#111827">Parent ≥ each child</text><g id="maxheap-tree" transform="translate(80,90) scale(1.1)" role="group" aria-label="Max-heap"><line x1="202.0" y1="100.0" x2="118.0" y2="154.0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
